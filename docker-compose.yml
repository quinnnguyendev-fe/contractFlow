
services:
  postgres:
    image: postgres:17-alpine
    container_name: contractflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contractflow
      POSTGRES_PASSWORD: contractflow_dev
      POSTGRES_DB: contractflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractflow -d contractflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
